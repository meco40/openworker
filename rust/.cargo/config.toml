# Host builds on Windows link with the LLD that rustup ships with the pinned
# toolchain (`rust-lld.exe`) instead of MSVC `link.exe`. Measured on the dev
# profile: an edit in betaclaw-gateway rebuilds in about 3 s instead of 15 s.
# rustc still sets up the MSVC library paths for it. Linux and container
# builds are not affected.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
