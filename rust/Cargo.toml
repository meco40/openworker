[workspace]
resolver = "2"
members = ["crates/betaclaw-core", "crates/betaclaw-gateway"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT"
publish = false

[workspace.dependencies]
aes-gcm = "0.11"
anyhow = "1"
axum = { version = "0.8", features = ["http1", "json", "query", "tokio", "ws"] }
base64 = "0.23"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# IANA time zones for the automation cron engine (`Intl`-compatible rule evaluation).
chrono-tz = "0.10"
getrandom = "0.3"
# Signature verification for agent-v2 extension manifests (RSA and ECDSA PEM keys,
# as `createVerify` in `extensions/security.ts`). Already in the lock file through rustls.
ring = "0.17"
# `Executor::fetch_many` returns a `Stream`, and sqlx 0.9 ships no `TryStreamExt`
# of its own (`sqlx-core` 0.9 has no `ext::try_stream` module any more), so the
# driver reads the stream with the same helper the sqlx documentation uses.
# `futures-util` 0.3 is already in the dependency graph as a dependency of
# `sqlx-core`, so this adds no new download and no second version.
futures-util = "0.3"
hkdf = "0.13"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "server", "tokio"] }
mime_guess = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "charset", "http2"] }
# Needed by the Memory modules (word boundaries, alternation and status-code
# patterns in `memory/poisoning.rs`, `memory/subject.rs`, `memory/mem0.rs`,
# `memory/errors.rs`, `memory/service.rs`, `memory/sqlite/client.rs`) and by the
# Model Hub files that hand-port JavaScript patterns
# (`openai_compatible/utils.rs`, `providers/anthropic.rs`,
# `providers/opencode.rs`, `providers/openai_codex/parsers/rate_limit_parser.rs`):
# they contain word boundaries, alternation and capture groups that cannot be
# hand-written.
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
scrypt = "0.12"
# The PostgreSQL driver of the World Model slice (S6), pinned as the driver
# crates instead of the `sqlx` facade. The facade always resolves
# `sqlx-sqlite`/`libsqlite3-sys` for its version graph, and that copy conflicts
# with the `libsqlite3-sys` of `rusqlite` (`links = "sqlite3"` may appear only
# once in a binary). No `macros`/`derive` feature on purpose:
# `docs/RUST_MIGRATION.md:64` requires runtime queries only, so the Docker build
# never needs a database. `_tls-rustls-ring-native-roots` mirrors `pg`, which
# trusts the operating system's CA store.
sqlx-core = { version = "0.9", default-features = false, features = [
  "_rt-tokio",
  "_tls-rustls-ring-native-roots",
] }
sqlx-postgres = { version = "0.9", default-features = false, features = [
  "json",
  "chrono",
  "uuid",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_urlencoded = "0.7"
sha2 = "0.11"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "limit", "trace", "util", "compression-gzip", "compression-br"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
