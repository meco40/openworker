[package]
name = "betaclaw-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "betaclaw_gateway"
path = "src/lib.rs"

[features]
# Enables helpers used by the integration tests.
test-support = []

[[bin]]
name = "betaclaw-gateway"
path = "src/main.rs"

[[bin]]
name = "betaclaw-scheduler"
path = "src/bin/betaclaw-scheduler.rs"

[dependencies]
betaclaw-core = { path = "../betaclaw-core" }

aes-gcm = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
futures-util = "0.3"
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
mime_guess = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[[test]]
name = "gateway_http"
path = "tests/gateway_http.rs"
required-features = ["test-support"]
