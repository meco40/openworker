name: Secret Scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan complete reachable history
        run: |
          docker run --rm --network none \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            zricethezav/gitleaks:v8.30.1 \
            git /repo --config /repo/.gitleaks.toml --log-opts=--all \
            --redact --ignore-gitleaks-allow --no-banner
