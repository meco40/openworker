services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: betaclaw-web
    restart: always
    # Published on all host interfaces. Login is enforced (REQUIRE_AUTH=true):
    # productionGuard refuses to start without it and without NEXTAUTH_SECRET.
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      SWARM_RUNNER: scheduler
      REQUIRE_AUTH: ${REQUIRE_AUTH:-true}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be set, run compose with --env-file .env.local}
      AUTH_DEFAULT_EMAIL: ${AUTH_DEFAULT_EMAIL:-}
      AUTH_DEFAULT_PASSWORD: ${AUTH_DEFAULT_PASSWORD:-}
      AUTH_DEFAULT_NAME: ${AUTH_DEFAULT_NAME:-Admin}
      MC_API_TOKEN: ${MC_API_TOKEN:-}
      SCHEDULER_HEALTH_TOKEN: ${SCHEDULER_HEALTH_TOKEN:-}
      MEMORY_PROVIDER: mem0
      # 127.0.0.1 inside a container is the container itself; mem0 runs on the host.
      MEM0_BASE_URL: ${MEM0_CONTAINER_BASE_URL:-http://host.docker.internal:8010}
      MEM0_API_KEY: ${MEM0_API_KEY}
      MEM0_API_PATH: ${MEM0_API_PATH:-/v1}
      MEM0_TIMEOUT_MS: ${MEM0_TIMEOUT_MS:-5000}
      MODEL_HUB_ENCRYPTION_KEY: ${MODEL_HUB_ENCRYPTION_KEY}
    volumes:
      - ./.local:/app/.local
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: betaclaw-scheduler
    restart: always
    command: ['node', '--import', 'tsx', 'scheduler.ts']
    environment:
      NODE_ENV: production
      SCHEDULER_INSTANCE_ID: scheduler-1
      SWARM_RUNNER: scheduler
      # Same auth guard as web (src/server/auth/productionGuard.ts).
      REQUIRE_AUTH: ${REQUIRE_AUTH:-true}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be set, run compose with --env-file .env.local}
      AUTH_DEFAULT_EMAIL: ${AUTH_DEFAULT_EMAIL:-}
      AUTH_DEFAULT_PASSWORD: ${AUTH_DEFAULT_PASSWORD:-}
      AUTH_DEFAULT_NAME: ${AUTH_DEFAULT_NAME:-Admin}
      MC_API_TOKEN: ${MC_API_TOKEN:-}
      MEMORY_PROVIDER: mem0
      MEM0_BASE_URL: ${MEM0_CONTAINER_BASE_URL:-http://host.docker.internal:8010}
      MEM0_API_KEY: ${MEM0_API_KEY}
      MEM0_API_PATH: ${MEM0_API_PATH:-/v1}
      MEM0_TIMEOUT_MS: ${MEM0_TIMEOUT_MS:-5000}
      MODEL_HUB_ENCRYPTION_KEY: ${MODEL_HUB_ENCRYPTION_KEY}
      AUTOMATION_TICK_INTERVAL_MS: 15000
      AUTOMATION_LEASE_TTL_MS: 30000
      AUTOMATION_MAX_ATTEMPTS: 3
      AUTOMATION_RETRY_BACKOFF_MS: 30000,120000,600000
      AUTOMATION_AUTO_PAUSE_FAILURES: 10
      SCHEDULER_HEALTH_TOKEN: ${SCHEDULER_HEALTH_TOKEN:-}
    volumes:
      - ./.local:/app/.local
    depends_on:
      web:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'if [ -n "$SCHEDULER_HEALTH_TOKEN" ]; then wget --no-verbose --tries=1 --header="x-scheduler-health-token: $SCHEDULER_HEALTH_TOKEN" --spider http://web:3000/api/health/scheduler; else wget --no-verbose --tries=1 --spider http://web:3000/api/health/scheduler; fi',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
