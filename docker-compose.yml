# ─── BetaClaw Control Plane ──────────────────────────────────────
#
# Topology during the Rust migration (see docs/RUST_MIGRATION.md):
#
#   browser / CLI ──► gateway (Rust, axum)  :3000  public listener
#                       ├── /ws       native WebSocket gateway
#                       ├── /api/*    every API route, answered in Rust
#                       └── pages     static UI export (/app/out) served by the gateway
#
# No Node application server runs in this file. The UI is the static export that
# `docker/Dockerfile.gateway` builds, and the gateway serves it. The auth gate and the
# tenant scope live in exactly one process, and ws://host:3000/ws?protocol=v2 is
# unchanged for the browser client and the CLI.

# Shared runtime environment. The Rust gateway and the scheduler read the same
# variables so the session cookie, the loopback marker and the database paths stay
# consistent.
x-betaclaw-runtime-env: &runtime-env
  NODE_ENV: production
  HOSTNAME: 0.0.0.0
  # The OAuth callback origin. When GATEWAY_PUBLISHED_PORT is changed, set
  # NEXTAUTH_URL and APP_URL to the matching host so callbacks resolve.
  NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
  APP_URL: ${APP_URL:-http://localhost:3000}
  SWARM_RUNNER: scheduler
  REQUIRE_AUTH: 'true'
  NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set a unique NEXTAUTH_SECRET}
  MODEL_HUB_ENCRYPTION_KEY: ${MODEL_HUB_ENCRYPTION_KEY:?Set a unique MODEL_HUB_ENCRYPTION_KEY}
  AUTH_DEFAULT_EMAIL: ${AUTH_DEFAULT_EMAIL:?Set AUTH_DEFAULT_EMAIL}
  AUTH_DEFAULT_PASSWORD: ${AUTH_DEFAULT_PASSWORD:?Set AUTH_DEFAULT_PASSWORD}
  AUTH_DEFAULT_NAME: ${AUTH_DEFAULT_NAME:-Admin}
  BETACLAW_EXEC_APPROVALS_REQUIRED: 'true'
  MEMORY_PROVIDER: postgres
  WORLD_MODEL_ENABLED: 'true'
  WORLD_MODEL_MODE: canonical
  WORLD_MODEL_RUNTIME_ROLE: app
  WORLD_MODEL_APP_DATABASE_URL: postgresql://world_model_app:${WORLD_MODEL_APP_ROLE_PASSWORD}@postgres:5432/betaclaw
  WORLD_MODEL_WORKER_DATABASE_URL: postgresql://world_model_worker:${WORLD_MODEL_WORKER_ROLE_PASSWORD}@postgres:5432/betaclaw
  WORLD_MODEL_DISPATCH_SCOPES: ${WORLD_MODEL_DISPATCH_SCOPES:-}
  SCHEDULER_HEALTH_TOKEN: ${SCHEDULER_HEALTH_TOKEN:-}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  LMSTUDIO_BASE_URL: ${LMSTUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
  # Job owners: `rust` (default) or `off`. `node` is refused at start-up.
  BETACLAW_TELEGRAM_POLLER: ${BETACLAW_TELEGRAM_POLLER:-rust}
  BETACLAW_SWARM_RUNNER: ${BETACLAW_SWARM_RUNNER:-rust}
  BETACLAW_WORKSPACE_CLEANUP: ${BETACLAW_WORKSPACE_CLEANUP:-rust}

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: betaclaw
      POSTGRES_USER: betaclaw_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique POSTGRES_PASSWORD in .env.local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U betaclaw_admin -d betaclaw']
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: applies the World-Model migrations and provisions the runtime roles
  # with the Rust subcommand (`betaclaw-scheduler migrate`). Same image as gateway.
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    image: betaclaw-gateway-local
    restart: 'no'
    command: ['betaclaw-scheduler', 'migrate', '--provision-roles', '--apply']
    environment:
      WORLD_MODEL_ADMIN_DATABASE_URL: postgresql://betaclaw_admin:${POSTGRES_PASSWORD}@postgres:5432/betaclaw
      WORLD_MODEL_APP_ROLE_PASSWORD: ${WORLD_MODEL_APP_ROLE_PASSWORD:?Set a unique WORLD_MODEL_APP_ROLE_PASSWORD}
      WORLD_MODEL_WORKER_ROLE_PASSWORD: ${WORLD_MODEL_WORKER_ROLE_PASSWORD:?Set a different WORLD_MODEL_WORKER_ROLE_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  # Rust gateway. Owns the public listener, the WebSocket upgrade, the auth gate,
  # every API route and the static UI export.
  #
  # Only the published host port is configurable. The container always listens on
  # 3000, so the scheduler keeps a fixed upstream target. Set
  # GATEWAY_PUBLISHED_PORT in `.env.local` when another application already
  # occupies 3000 on this machine; NEXTAUTH_URL has to be adapted to match,
  # because it is the OAuth callback origin.
  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    image: betaclaw-gateway-local
    restart: unless-stopped
    init: true
    ports:
      - '127.0.0.1:${GATEWAY_PUBLISHED_PORT:-3000}:3000'
    environment:
      <<: *runtime-env
      PORT: '3000'
      # UI_STATIC_DIR serves the static export. The proxy origin is only used by
      # `pnpm run dev` (Next dev server), so it stays empty here.
      GATEWAY_UPSTREAM_ORIGIN: ${GATEWAY_UPSTREAM_ORIGIN:-}
      UI_STATIC_DIR: /app/out
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - app-data:/app/.local
      - workspaces:/app/workspaces
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        ['CMD', 'curl', '--fail', '--silent', '--show-error', 'http://127.0.0.1:3000/__rust/health']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    image: betaclaw-gateway-local
    restart: unless-stopped
    init: true
    command: ['betaclaw-scheduler']
    environment:
      <<: *runtime-env
      WORLD_MODEL_RUNTIME_ROLE: worker
      SCHEDULER_INSTANCE_ID: scheduler-1
      # The scheduler health probe moved behind the gateway's public port.
      APP_URL: http://gateway:3000
      RUST_LOG: ${RUST_LOG:-info}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - app-data:/app/.local
      - workspaces:/app/workspaces
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'if [ -n "$$SCHEDULER_HEALTH_TOKEN" ]; then curl --fail --silent --show-error --header "x-scheduler-health-token: $$SCHEDULER_HEALTH_TOKEN" http://gateway:3000/api/health/scheduler > /dev/null; else curl --fail --silent --show-error http://gateway:3000/api/health/scheduler > /dev/null; fi',
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres-data:
  app-data:
  workspaces:
