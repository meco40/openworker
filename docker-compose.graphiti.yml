services:
  graphiti-neo4j:
    image: neo4j:5.26.2
    container_name: openclaw-graphiti-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${GRAPHITI_NEO4J_USER:-neo4j}/${GRAPHITI_NEO4J_PASSWORD:-change-me-local}
    volumes:
      - graphiti-neo4j-data-526:/data
      - graphiti-neo4j-logs-526:/logs
    ports:
      - '7475:7474'
      - '7688:7687'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:7474 || exit 1']
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  graphiti:
    # The published 0.22.1 tag is currently unavailable on Docker Hub.
    # Pin the currently published official image by digest for reproducibility.
    image: zepai/graphiti@sha256:76d14f30afc65d2f914637d67d0c0631a7e779e2740be1ae99b9dc0c5876d2da
    container_name: openclaw-graphiti
    restart: unless-stopped
    depends_on:
      graphiti-neo4j:
        condition: service_healthy
    environment:
      # Graphiti talks to the app's internal Model-Hub adapter. The actual
      # provider OAuth secret stays encrypted in the app's Model-Hub database.
      OPENAI_API_KEY: ${GRAPHITI_MODEL_HUB_TOKEN:?GRAPHITI_MODEL_HUB_TOKEN must be set}
      OPENAI_BASE_URL: ${GRAPHITI_OPENAI_BASE_URL:-http://host.docker.internal:3000/api/internal/model-hub/graphiti/v1}
      EMBEDDING_API_KEY: ${GRAPHITI_EMBEDDING_API_KEY:?GRAPHITI_EMBEDDING_API_KEY must be set}
      EMBEDDING_BASE_URL: ${GRAPHITI_EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      # These are transport names only. The app adapter resolves the active
      # Model Hub entry from the fixed p1-graphiti profile for every request.
      MODEL_NAME: ${GRAPHITI_MODEL_NAME:-graphiti-json}
      # Small model used by graphiti_core for cheap subtasks (upstream default
      # gpt-4.1-nano). Empty = same as MODEL_NAME.
      SMALL_MODEL_NAME: ${GRAPHITI_SMALL_MODEL_NAME:-graphiti-json}
      EMBEDDING_MODEL_NAME: ${GRAPHITI_EMBEDDING_MODEL_NAME:-text-embedding-v4}
      # DashScope text-embedding-v4 returns native 2048-dimensional vectors;
      # the mounted patch chunks embedding batches to <=10 items (DashScope
      # limit). Existing Graphiti data is rebuilt from PostgreSQL after an
      # embedding-model switch.
      EMBEDDING_DIM: ${GRAPHITI_EMBEDDING_DIM:-2048}
      NEO4J_URI: bolt://graphiti-neo4j:7687
      NEO4J_USER: ${GRAPHITI_NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${GRAPHITI_NEO4J_PASSWORD:-change-me-local}
      NEO4J_PORT: 7687
      db_backend: neo4j
      PORT: 8000
      # LLM output budget for extraction/dedup calls. The mounted
      # docker/graphiti patch wires this env var into the LLM client.
      MAX_TOKENS: ${GRAPHITI_LLM_MAX_TOKENS:-16384}
      # graphiti_core reads SEMAPHORE_LIMIT for max concurrent LLM calls.
      # Keep low (e.g. 2) for rate-limited free-tier providers; the DashScope
      # setup runs with a higher value via GRAPHITI_SEMAPHORE_LIMIT.
      SEMAPHORE_LIMIT: ${GRAPHITI_SEMAPHORE_LIMIT:-2}
      # Concurrent ingest-queue workers. Upstream Graphiti processes the
      # message queue with a single worker; the mounted docker/graphiti/
      # ingest.py patch spawns this many so a full rebuild does not serialize
      # every episode across every scope behind one worker.
      QUEUE_WORKERS: ${GRAPHITI_QUEUE_WORKERS:-4}
      # Bound one LLM/Graphiti episode so a provider stall cannot block the
      # queue forever. Failed jobs remain visible through /queue-status.
      QUEUE_JOB_TIMEOUT_SECONDS: ${GRAPHITI_QUEUE_JOB_TIMEOUT_SECONDS:-300}
    volumes:
      # OpenClaw patches against the pinned 0.22.0 server (see docker/graphiti/).
      - ./docker/graphiti/config.py:/app/graph_service/config.py:ro
      - ./docker/graphiti/retrieve.py:/app/graph_service/dto/retrieve.py:ro
      - ./docker/graphiti/zep_graphiti.py:/app/graph_service/zep_graphiti.py:ro
      - ./docker/graphiti/ingest.py:/app/graph_service/routers/ingest.py:ro
    ports:
      - '8001:8000'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthcheck', timeout=5).read()",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  graphiti-neo4j-data-526:
  graphiti-neo4j-logs-526:
