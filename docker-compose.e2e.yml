# Container lanes for the E2E suites. The lanes run the same scripts as the host
# (`pnpm run test:e2e:smoke`, `pnpm run test:e2e:browser`), which start the Rust gateway
# and scheduler from rust/target/debug.
#
# `e2e-rust-build` compiles both binaries once with the pinned toolchain image. The Node
# lanes wait for it and mount the same target volume, so they use those binaries.
services:
  e2e-rust-build:
    image: rust:1.94-bookworm
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - e2e_rust_target:/workspace/rust/target
      - e2e_cargo_registry:/usr/local/cargo/registry
    command:
      [
        'cargo',
        'build',
        '--locked',
        '--manifest-path',
        'rust/Cargo.toml',
        '--bin',
        'betaclaw-gateway',
        '--bin',
        'betaclaw-scheduler',
      ]

  e2e-smoke:
    image: node:22
    working_dir: /workspace
    depends_on:
      e2e-rust-build:
        condition: service_completed_successfully
    volumes:
      - ./:/workspace
      - e2e_smoke_node_modules:/workspace/node_modules
      - e2e_smoke_next:/workspace/.next
      - e2e_rust_target:/workspace/rust/target
    # Repo is pnpm-only (no package-lock.json); activate the pinned pnpm like the Dockerfile.
    command:
      [
        'sh',
        '-lc',
        'corepack enable && corepack prepare pnpm@10.30.1 --activate && pnpm install --frozen-lockfile && pnpm run build && pnpm run test:e2e:smoke',
      ]

  e2e-browser:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    working_dir: /workspace
    depends_on:
      e2e-rust-build:
        condition: service_completed_successfully
    volumes:
      - ./:/workspace
      - e2e_browser_node_modules:/workspace/node_modules
      - e2e_browser_next:/workspace/.next
      - e2e_rust_target:/workspace/rust/target
    environment:
      CI: '1'
      PLAYWRIGHT_PORT: '3000'
    command:
      [
        'sh',
        '-lc',
        'corepack enable && corepack prepare pnpm@10.30.1 --activate && pnpm install --frozen-lockfile && pnpm run test:e2e:browser',
      ]

volumes:
  e2e_rust_target:
  e2e_cargo_registry:
  e2e_smoke_node_modules:
  e2e_smoke_next:
  e2e_browser_node_modules:
  e2e_browser_next:
